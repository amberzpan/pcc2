<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>PCC2 API 测试</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 800px; margin: 50px auto; padding: 20px; }
        h1 { color: #e6162d; }
        .test-section { margin: 20px 0; padding: 15px; border: 1px solid #ddd; border-radius: 8px; }
        .result { background: #f5f5f5; padding: 10px; margin-top: 10px; white-space: pre-wrap; word-break: break-all; font-size: 12px; }
        button { background: #e6162d; color: white; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; margin: 5px; }
        button:hover { background: #d51225; }
        .success { color: green; }
        .error { color: red; }
    </style>
</head>
<body>
    <h1>PCC2 社交平台 - API 测试</h1>

    <div class="test-section">
        <h3>1. 获取帖子列表</h3>
        <button onclick="testPostList()">测试 /api/post/list</button>
        <div id="result1" class="result">点击按钮开始测试...</div>
    </div>

    <div class="test-section">
        <h3>2. 用户登录</h3>
        <input type="text" id="username" placeholder="用户名" value="aaa"> 
        <input type="password" id="password" placeholder="密码" value="aaa">
        <button onclick="testLogin()">测试登录</button>
        <div id="result2" class="result">点击按钮开始测试...</div>
    </div>

    <div class="test-section">
        <h3>3. 获取用户信息 (需登录)</h3>
        <button onclick="testUserInfo()">测试 /api/user/info</button>
        <div id="result3" class="result">点击按钮开始测试...</div>
    </div>

    <div class="test-section">
        <h3>4. 获取我的帖子</h3>
        <button onclick="testMyPosts()">测试 /api/post/user/2</button>
        <div id="result4" class="result">点击按钮开始测试...</div>
    </div>

    <div class="test-section">
        <h3>5. 视频上传测试</h3>
        <input type="file" id="videoFile" accept="video/*">
        <button onclick="testVideoUpload()">测试上传视频</button>
        <div id="result5" class="result">点击按钮开始测试...</div>
    </div>

    <script>
        const API_BASE = 'http://localhost:5173/api';
        let token = localStorage.getItem('token');

        async function testPostList() {
            const result = document.getElementById('result1');
            result.innerHTML = '测试中...';
            try {
                const res = await fetch(API_BASE + '/post/list?page=1&size=5');
                const data = await res.json();
                result.innerHTML = JSON.stringify(data, null, 2);
                result.className = data.code === 200 ? 'result success' : 'result error';
            } catch (e) {
                result.innerHTML = '错误: ' + e.message;
                result.className = 'result error';
            }
        }

        async function testLogin() {
            const result = document.getElementById('result2');
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            result.innerHTML = '测试中...';
            try {
                const res = await fetch(API_BASE + '/user/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json();
                result.innerHTML = JSON.stringify(data, null, 2);
                if (data.code === 200 && data.data && data.data.token) {
                    token = data.data.token;
                    localStorage.setItem('token', token);
                    result.className = 'result success';
                    result.innerHTML += '\n\n✅ 登录成功！Token已保存到localStorage';
                } else {
                    result.className = 'result error';
                }
            } catch (e) {
                result.innerHTML = '错误: ' + e.message;
                result.className = 'result error';
            }
        }

        async function testUserInfo() {
            const result = document.getElementById('result3');
            result.innerHTML = '测试中...';
            try {
                const res = await fetch(API_BASE + '/user/info', {
                    headers: { 'Authorization': 'Bearer ' + token }
                });
                const data = await res.json();
                result.innerHTML = JSON.stringify(data, null, 2);
                result.className = data.code === 200 ? 'result success' : 'result error';
            } catch (e) {
                result.innerHTML = '错误: ' + e.message;
                result.className = 'result error';
            }
        }

        async function testMyPosts() {
            const result = document.getElementById('result4');
            result.innerHTML = '测试中...';
            try {
                const res = await fetch(API_BASE + '/post/user/2?page=1&size=5');
                const data = await res.json();
                result.innerHTML = JSON.stringify(data, null, 2);
                result.className = data.code === 200 ? 'result success' : 'result error';
            } catch (e) {
                result.innerHTML = '错误: ' + e.message;
                result.className = 'result error';
            }
        }

        async function testVideoUpload() {
            const result = document.getElementById('result5');
            const fileInput = document.getElementById('videoFile');
            const file = fileInput.files[0];
            if (!file) {
                result.innerHTML = '请先选择视频文件';
                result.className = 'result error';
                return;
            }
            result.innerHTML = '上传中...';
            try {
                const formData = new FormData();
                formData.append('file', file);
                const res = await fetch(API_BASE + '/post/uploadVideo', {
                    method: 'POST',
                    headers: { 'Authorization': 'Bearer ' + token },
                    body: formData
                });
                const data = await res.json();
                result.innerHTML = JSON.stringify(data, null, 2);
                result.className = data.code === 200 ? 'result success' : 'result error';
            } catch (e) {
                result.innerHTML = '错误: ' + e.message;
                result.className = 'result error';
            }
        }
    </script>
</body>
</html>
